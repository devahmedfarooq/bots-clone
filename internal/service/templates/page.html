{{define "page"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false,"selfRequestsOnly":true,"historyCacheSize":0}'>
  <title>Local Bots</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/htmx.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="border-b border-line px-6 py-5">
    <div class="mx-auto flex max-w-5xl items-center justify-between">
      <span class="text-xl font-semibold">◈ Local Bots</span>
      <a href="/board" class="text-sm text-accent">Bot Operations</a>
      <span class="hidden text-sm text-muted sm:inline">One model · Your laptop</span>
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-4 py-8 sm:px-6 sm:py-10">
    <div class="mb-7">
      <p class="text-xs font-semibold tracking-widest text-accent">WORKSPACE</p>
      <h1 class="mt-3 mb-3 text-3xl font-semibold tracking-tight sm:text-4xl">Your bots, ready to work.</h1>
      <p class="muted">Run a task, follow its progress, and inspect what happened.</p>
    </div>
    <p id="notice" class="mb-6 min-h-6 text-sm text-amber-200" role="status" aria-live="polite"></p>
    <div id="workspace" hx-get="/ui/workspace" hx-trigger="load" hx-swap="innerHTML">
      <p class="muted">Connecting to the local service…</p>
    </div>
  </main>
  <footer class="p-5 text-center text-xs text-muted">Local inference · Offline after setup · Prompt-only baseline</footer>
</body>
</html>
{{end}}
